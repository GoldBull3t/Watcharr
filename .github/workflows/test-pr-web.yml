name: Test PR (web)

on:
  pull_request:
    branches:
      - "**"
    tags-ignore:
      - v*
    paths:
      - ".github/workflows/test-pr-web.yml"
      - "package*.json"
      - "svelte.config.js"
      - "vite.config.ts"
      - "tsconfig.json"
      - ".prettier*"
      - "src/**"

jobs:
  linter_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Get dependencies
        run: npm i

      - name: Check for linting/formatting errors
        run: npm run lint

      - name: Check TypeScript & Svelte types
        run: npm run check
