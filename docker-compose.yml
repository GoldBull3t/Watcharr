services:
  watcharr:
    # Build directly from this fork (Single Go binary + Static SPA, Zero Node.js)
    build:
      context: .
      dockerfile: Dockerfile
    image: my-watcharr:latest
    container_name: watcharr
    ports:
      - "3080:3080"
    environment:
      - PORT=3080
      - TZ=UTC
      # Set to "true" to allow outbound webhooks to private LAN IPs (Home Assistant, Discord bots, etc.)
      # - ALLOW_LOCAL_WEBHOOKS=true
      # Optional external database (PostgreSQL or MySQL):
      # - DB_TYPE=postgres
      # - DATABASE_URL=postgres://user:password@localhost:5432/watcharr?sslmode=disable
      # Optional: Preconfigure keys via environment if preferred
      # - OMDB_KEY=your_omdb_key
      # - MDBLIST_KEY=your_mdblist_key
      # - TMDB_KEY=your_tmdb_key
      # - TWITCH_CLIENT_ID=your_twitch_client_id
      # - TWITCH_CLIENT_SECRET=your_twitch_client_secret
    volumes:
      # Contains all watcharr data (database & cache)
      - ./data:/data
    restart: unless-stopped
